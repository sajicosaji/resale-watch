name: resale-watch

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 JST (morning)
    - cron: "0 9 * * *"    # 18:00 JST (evening, 2026-07-26: restored to 2x/day — repo is now public, no Actions minute limit)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run resale watch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          claude -p "$(cat prompt.md)" \
            --model claude-sonnet-5 \
            --allowedTools "WebSearch,WebFetch,Bash,Read,Write" \
            --permission-mode bypassPermissions \
            --max-turns 80

      - name: Save history
        run: |
          git config user.name "resale-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "配信履歴を更新"
            git pull --rebase origin main || true
            git push
          fi
