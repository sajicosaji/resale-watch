name: build-calendar

on:
  schedule:
    - cron: "40 22 * * *"   # 07:40 JST (after morning runs)
    - cron: "40 9 * * *"    # 18:40 JST (after evening runs)
  workflow_dispatch:
    inputs:
      max_hours:
        description: "止まっていると見なす時間（試験用）"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build calendar page
        run: python build_calendar.py

      - name: Commit and push
        run: |
          git config user.name "resale-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "calendar: update"
            git pull --rebase origin main || true
            git push
          fi

      - name: 配信が止まっていないか見る
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_CONVENI: ${{ secrets.DISCORD_WEBHOOK_CONVENI }}
          MAX_HOURS: ${{ inputs.max_hours }}
        run: python deliver.py check
