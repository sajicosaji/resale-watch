name: conveni-watch

on:
  schedule:
    - cron: "10 22 * * *"   # 07:10 JST (morning。2026-08-24: クレジット上限到達対策で夜便を停止、1日1回に削減)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Determine model (schedule=sonnet, manual test=haiku)
        id: model
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=claude-haiku-4-5-20251001" >> "$GITHUB_OUTPUT"
          else
            echo "name=claude-sonnet-5" >> "$GITHUB_OUTPUT"
          fi

      - name: Run conveni watch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISCORD_WEBHOOK_CONVENI: ${{ secrets.DISCORD_WEBHOOK_CONVENI }}
        run: |
          claude -p "$(cat conveni_prompt.md)" \
            --model ${{ steps.model.outputs.name }} \
            --allowedTools "WebSearch,WebFetch,Bash,Read,Write" \
            --permission-mode bypassPermissions \
            --max-turns 30

      - name: Save history
        run: |
          git config user.name "resale-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history_conveni.json
          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "コンビニ配信履歴を更新"
            git pull --rebase origin main || true
            git push
          fi
